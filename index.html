<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- CSS-only state: theme, sidebar and filter -->
  <input type="checkbox" id="dark" class="state" aria-label="Dark mode">
  <input type="checkbox" id="collapse" class="state" aria-label="Collapse sidebar">
  <input type="radio" name="filter" id="f-all" class="state" checked>
  <input type="radio" name="filter" id="f-active" class="state">
  <input type="radio" name="filter" id="f-done" class="state">

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <label for="collapse" class="menu-btn" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M3 5h18M3 12h18M3 19h18"/></svg>
      </label>

      <div class="profile">
        <div class="avatar" aria-hidden="true">A</div>
        <p class="name">Md. Amirul Islam</p>
        <p class="mobile">01554-511340</p>
      </div>

      <nav class="nav">
        <a href="#" class="nav-item active" aria-current="page">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1.5"/><path d="M13 6h8"/><path d="m3.5 16 2 2 4-4"/><path d="M13 17h8"/></svg>
          <span>My Tasks</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <label for="dark" class="theme-btn" title="Toggle dark mode">
        <svg class="moon" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </label>

      <div class="content">
        <h1>My Tasks</h1>

        <div class="add">
          <input type="text" placeholder="Type your task here.." aria-label="New task">
          <button type="button" class="add-btn">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add
          </button>
        </div>

        <section class="tasks">
          <div class="filters">
            <label for="f-all">All</label><span aria-hidden="true">|</span>
            <label for="f-active">Active</label><span aria-hidden="true">|</span>
            <label for="f-done">Completed</label>
          </div>

          <div class="list">
            <input type="checkbox" id="t1" class="cb">
            <article class="task">
              <label for="t1" class="task-label"><span class="box"></span><span class="text">Learn React</span></label>
              <div class="actions">
                <button type="button" aria-label="Edit Learn React"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
                <button type="button" aria-label="Delete Learn React"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></button>
              </div>
            </article>

            <input type="checkbox" id="t2" class="cb" checked>
            <article class="task">
              <label for="t2" class="task-label"><span class="box"></span><span class="text">Prototyping To-Do List</span></label>
              <div class="actions">
                <button type="button" aria-label="Edit Prototyping To-Do List"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
                <button type="button" aria-label="Delete Prototyping To-Do List"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></button>
              </div>
            </article>

            <input type="checkbox" id="t3" class="cb">
            <article class="task">
              <label for="t3" class="task-label"><span class="box"></span><span class="text">Push to Github</span></label>
              <div class="actions">
                <button type="button" aria-label="Edit Push to Github"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
                <button type="button" aria-label="Delete Push to Github"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></button>
              </div>
            </article>
          </div>

          <!-- Placed after the list so the CSS counter has seen every task -->
          <p class="left"></p>
        </section>
      </div>

      <footer>&copy; 2025</footer>
    </main>
  </div>

  <script src="./JS/script.js"></script>
</body>
</html>
